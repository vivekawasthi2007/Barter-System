<!DOCTYPE html>
<html>
<head>
<title>Profile - BarterX</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

/* Layout */
.container{
    max-width:1100px;
    margin:30px auto;
    background:#fff;
    padding:20px;
    border-radius:20px;
}

/* Header */
.header{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#ddd;
    object-fit:cover;
}

/* Buttons */
button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.logout{background:red;color:white;}
.edit{background:#667eea;color:white;}
.delete{background:red;color:white;}

/* Sections */
.section{
    margin-top:25px;
}

/* Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:#f9f9f9;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- PROFILE HEADER -->
<div class="header">
    <img id="avatar" class="avatar" src="https://via.placeholder.com/80">
    
    <div>
        <h2 id="email"></h2>
        <p>Contact: <span id="contact"></span></p>
        <button class="edit" onclick="editProfile()">Edit Profile</button>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</div>

<!-- MY ITEMS -->
<div class="section">
    <h3>📦 My Items</h3>
    <div id="myItems" class="grid"></div>
</div>

<!-- WISHLIST -->
<div class="section">
    <h3>❤️ Wishlist</h3>
    <div id="wishlist" class="grid"></div>
</div>

<!-- MESSAGES -->
<div class="section">
    <h3>💬 Messages</h3>
    <div id="messages"></div>
</div>

</div>

<script>
const BASE_URL = "http://127.0.0.1:5000";
let userId = localStorage.getItem("user_id");

// Logout
function logout(){
    localStorage.removeItem("user_id");
    window.location="login.html";
}

// Load Profile
async function loadProfile(){

    // USER
    let users = await fetch(BASE_URL+"/users").then(r=>r.json());
    let user = users.find(u=>u.id == userId);

    if(user){
        email.innerText = user.email;
        contact.innerText = user.contact || "Not set";
    }

    // ITEMS
    let items = await fetch(BASE_URL+"/items").then(r=>r.json());

    let html="";
    items.forEach(i=>{
        if(i.user_id == userId){
            let img = i.image 
                ? BASE_URL+"/static/uploads/"+i.image 
                : "https://via.placeholder.com/200";

            html += `
            <div class="card">
                <img src="${img}" width="100%">
                <h4>${i.title}</h4>
                <p>₹${i.price}</p>
                <button class="delete" onclick="deleteItem(${i.id})">Delete</button>
            </div>`;
        }
    });

    myItems.innerHTML = html;

    // WISHLIST
    let wish = await fetch(BASE_URL+"/wishlist/"+userId).then(r=>r.json());

    let wishHTML="";
    wish.forEach(i=>{
        wishHTML += `<div class="card"><p>${i.title}</p></div>`;
    });

    wishlist.innerHTML = wishHTML;

    // MESSAGES
    let msgs = await fetch(BASE_URL+"/messages/"+userId).then(r=>r.json());

    let msgHTML="";
    msgs.forEach(m=>{
        msgHTML += `<p>From ${m.sender_id}: ${m.message}</p>`;
    });

    messages.innerHTML = msgHTML;
}

// Edit Profile
async function editProfile(){
    let newContact = prompt("Enter new contact:");
    if(!newContact) return;

    await fetch(BASE_URL+"/update_user",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            id:userId,
            contact:newContact
        })
    });

    alert("Updated!");
    loadProfile();
}

// Delete Item
async function deleteItem(id){
    await fetch(BASE_URL+"/delete_item/"+id,{method:"DELETE"});
    loadProfile();
}

loadProfile();
</script>

</body>
</html>
