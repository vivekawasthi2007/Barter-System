<!DOCTYPE html>
<html>
<head>
<title>BarterX Marketplace</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

/* THEME VARIABLES */
:root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#222;
    --primary:#667eea;
}

.dark{
    --bg:#1e1e2f;
    --card:#2c2c3e;
    --text:#fff;
}

/* BODY */
body{
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:var(--card);
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:var(--primary);
}

/* ACTIONS */
.nav-actions{
    display:flex;
    gap:15px;
}

.nav-actions button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

/* TITLE */
.title{
    text-align:center;
    margin-bottom:20px;
    font-size:32px;
    font-weight:bold;
    color:var(--primary);
}

/* BUTTONS */
.actions{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:25px;
}

.actions button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:var(--primary);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.actions button:hover{
    transform:scale(1.05);
}

/* SECTIONS */
.section{
    display:none;
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;}
}

/* SEARCH */
#search{
    width:100%;
    padding:12px;
    border-radius:15px;
    border:1px solid #ccc;
    margin-bottom:15px;
}

/* GRID */
.items{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

/* CARD */
.card{
    background:var(--card);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
    position:relative;
}

.card:hover{
    transform:translateY(-8px);
}

/* IMAGE */
.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

/* CONTENT */
.content{
    padding:12px;
}

.price{
    font-weight:bold;
    color:green;
}

/* DELETE BUTTON */
.delete{
    position:absolute;
    top:10px;
    right:10px;
    background:red;
    color:white;
    border:none;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
}

/* FORM */
input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.add-btn{
    background:green;
    color:white;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

/* EMPTY */
.empty{
    text-align:center;
    margin-top:30px;
    color:gray;
    font-size:18px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">🚀 BarterX</div>

    <div class="nav-actions">
        <button onclick="toggleTheme()">🌙</button>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

<h1 class="title">🚀 BarterX Marketplace</h1>

<div class="actions">
    <button onclick="showBuy()">🛒 Buy Goods</button>
    <button onclick="showSell()">📦 Sell Goods</button>
</div>

<!-- BUY SECTION -->
<div id="buySection" class="section">
    <input id="search" placeholder="🔍 Search..." onkeyup="searchItems()">

    <div id="items" class="items"></div>

    <!-- ✅ FIXED EMPTY MESSAGE -->
    <p id="empty" class="empty"></p>
</div>

<!-- SELL SECTION -->
<div id="sellSection" class="section">
    <h2>Add Item</h2>
    <input id="title" placeholder="Item Title">
    <input id="category" placeholder="Category">
    <input id="price" placeholder="Price">
    <input id="image" type="file">
    <button class="add-btn" onclick="addItem()">Add Item</button>
</div>

</div>

<script src="/static/script.js"></script>

<script>
// Show sections
function showBuy(){
    document.getElementById("buySection").style.display="block";
    document.getElementById("sellSection").style.display="none";
    loadItems();
}

function showSell(){
    document.getElementById("buySection").style.display="none";
    document.getElementById("sellSection").style.display="block";
}

// Search
function searchItems(){
    let input = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".card").forEach(card=>{
        let title = card.querySelector("h3").innerText.toLowerCase();
        card.style.display = title.includes(input) ? "block" : "none";
    });
}

// Theme toggle
function toggleTheme(){
    document.body.classList.toggle("dark");
}

// Logout
function logout(){
    localStorage.removeItem("user_id");
    localStorage.removeItem("token");
    window.location="login.html";
}

// Auto load
window.onload = function(){
    showBuy();
};
</script>

</body>
</html>
